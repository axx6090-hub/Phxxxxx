name: Find brand logos
on:
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I .github/scripts/find_logos.py .github/scripts/brand_sites.json
      - uses: actions/upload-artifact@v4
        with:
          name: logo-candidates
          path: logo-candidates
