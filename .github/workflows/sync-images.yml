name: Copy store photos into the repo

# After any change to the store data, every photo that still points at another
# website is downloaded into frontend/public/images and the data is pointed at
# the copy, so the repo matches the live site.
on:
  push:
    branches: [main]
    paths:
      - frontend/src/staticData.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Copy photos
        run: python -I .github/scripts/sync_images.py
      - name: Commit
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard frontend/public/images)" ]; then
            echo "nothing to copy"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/staticData.json frontend/public/images
          git commit -m "Copy store photos into the repo"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
